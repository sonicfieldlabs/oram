# Portable PR checks run once; full platform qualification is deliberate.
name: macOS App

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run complete platform and release qualification (prefer local execution)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build SwiftPM app
        working-directory: apps/macos
        run: swift build
      - name: Stage unsigned app
        run: apps/macos/script/build_and_run.sh --no-open
      - name: Upload ORAM.app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ORAM-unsigned-app
          path: apps/macos/dist/ORAM.app
          retention-days: 7
