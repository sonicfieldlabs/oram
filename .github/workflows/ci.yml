name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install PortAudio runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libportaudio2
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check src tests

  dashboard-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/oram/web/static/app.js
