name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  optional-lock-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.12.16"}
          - {os: macos-latest, python: "3.14.10"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install patched optional cache and build helpers from wheels
        run: >-
          python -m pip --isolated install --only-binary=:all:
          filelock==4.2.7 setuptools==84.2.1
      - name: Exercise a synthetic lock without an audio model
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from filelock import FileLock, Timeout
          from setuptools import build_meta

          with TemporaryDirectory() as directory:
              path = Path(directory) / "synthetic-cache.lock"
              first = FileLock(path)
              second = FileLock(path)
              with first:
                  try:
                      second.acquire(timeout=0)
                  except Timeout:
                      pass
                  else:
                      raise AssertionError("A second cache writer acquired a held lock")
              with second:
                  assert second.is_locked
          assert callable(build_meta.get_requires_for_build_wheel)
          print("Patched lock exclusion, release/reacquire and build-helper import passed")
          PY

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Install PortAudio runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libportaudio2
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev pytest -q
      - run: uv run --locked --extra dev ruff check src tests

  dashboard-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --check src/oram/web/static/app.js
